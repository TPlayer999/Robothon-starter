# TACTILE-DEX default training configuration.
# All paths are relative to the submission root (submissions/tactile-dex-leap/).

env:
  max_episode_steps: 120
  action_substeps: 4
  use_weld_curriculum: true
  weld_steps: 40
  target_is_random: true

reward:
  w_align: 1.0
  w_grasp: 0.3
  w_alive: 0.02
  w_ctrl: 0.005
  w_drop: -2.0
  w_reach_align: 5.0
  touch_threshold: 0.5
  drop_z: 0.02
  align_success: 0.95

ppo:
  policy: "MlpPolicy"
  policy_kwargs:
    net_arch: [256, 256]
  learning_rate: 3.0e-4
  n_steps: 4096
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  device: "cpu"   # Apple Silicon: sb3 PPO runs CPU-only (MPS unsupported)

train:
  total_timesteps: 2000000
  n_envs: 8
  checkpoint_every: 100000
  log_dir: "runs"
  model_dir: "models"
  model_name: "ppo_leap_dex"
  seed: 0
